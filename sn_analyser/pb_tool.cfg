[plugin]
name: sn_analyser
version: 1.0.0

# fichiers Python (hors tests)
python_files: __init__.py plugin.py

source_dir: .

# sous-package core/ à embarquer
package_dir: core

# interfaces Qt Designer
compiled_ui_files: ui/accueil.ui ui/urbanisation.ui ui/erosion.ui ui/environnement.ui ui/analyse.ui ui/rapport.ui ui/parametres.ui

# ressources
resource_files: resources.qrc

# fichiers additionnels à copier lors du déploiement
extras: metadata.txt icons README.md LICENSE

# dossiers à créer mais vides au déploiement
extra_dirs: reports temp data

[validation]
required_metadata: version name qgisMinimumVersion description author email about tracker repository icon
